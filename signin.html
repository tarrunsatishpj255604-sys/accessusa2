
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | balanceyourtime.</title>
    <meta name="description" content="Sign in to your balanceyourtime. account.">

    <link rel="icon" type="image/svg+xml" href="./favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script type="module" src="auth.js"></script>
</head>

<body class="auth-page">

    <header class="auth-navbar">
        <div class="container auth-nav-container">
            <a href="index.html" class="logo">
                balanceyourtime<span>.</span>
            </a>

            <a href="index.html" class="back-link">
                <span aria-hidden="true">←</span> Back to home
            </a>
        </div>
    </header>

    <main class="auth-main">

        <section class="auth-card">

            <div class="auth-heading">
            



                <h1>Good to see you again.</h1>

                <p>
                    Your time, your priorities.
                    Pick up right where you left off.
                </p>
            </div>

            <div class="auth-message"
                 id="authMessage"
                 role="alert"
                 aria-live="polite"
                 hidden>
            </div>

            <button type="button"
                    class="google-button"
                    id="googleSignIn">

                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.91 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.72 7.18l7.67 5.95c4.48-4.14 7.09-10.25 7.09-17.6Z"/>
                    <path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a24 24 0 0 0 0 21.56l7.98-6.19Z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.85l-7.67-5.95c-2.13 1.43-4.86 2.27-8.22 2.27-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>
                </svg>

                Continue with Google
            </button>

            <div class="auth-divider">
                <span></span>
                <p>OR CONTINUE WITH EMAIL</p>
                <span></span>
            </div>

            <form id="signInForm">

                <div class="form-group">
                    <label for="signinEmail">Email address</label>

                    <input
                        type="email"
                        id="signinEmail"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="signinPassword">Password</label>

                        <a href="forgot-password.html" class="forgot-link">
                            Forgot password?
                        </a>
                    </div>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="signinPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-toggle-password="signinPassword"
                            aria-label="Show password">
                            Show
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                    id="signInSubmit">

                    Sign In
                    <span aria-hidden="true">→</span>
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>

            <p class="auth-legal">
                By continuing, you agree to use balanceyourtime.
                responsibly and respectfully.
            </p>

        </section>

    </main>

    <footer class="auth-footer">
        <p>Made for AccessUSA</p>
    </footer>

</body>
</html>
